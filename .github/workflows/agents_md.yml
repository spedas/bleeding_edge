name: agents_md

# Checks the YAML header of every AGENTS.md (see the root AGENTS.md).
# Runs on every push and pull request, not only when an AGENTS.md changes:
# renaming or deleting a file that a header lists should show up here too.
# Pushes made by the mirror workflow don't trigger other workflows, so this
# also runs weekly, an hour after mirror_bleeding_edge.yml.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "00 13 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Check AGENTS.md headers
        run: python .github/scripts/check_agents_md.py
